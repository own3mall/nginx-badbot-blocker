    "~*(?i)(^MFC_Tear_Sample|^MIDown tool|^MIIxpc|^MJ12bot|^MQQBrowser|^MSFrontPage|^MSIECrawler|^MTRobot|^Mag-Net|^Magnet|^Mail\.RU_Bot|^Majestic-SEO|^Majestic12|^majestic12|^MarkMonitor|^MarkWatch|^Mass\.Downloader|^masscan|^Mata\.Hari|^MauiBot|^Mb2345Browser|^MeanPath Bot|^Meanpathbot|^Mediatoolkitbot|^MegaIndex|^MegaIndex\.ru|^Memo|^Metauri|^meta-externalagent|^meta-webindexer|^MicroMessenger|^Microsoft Data Access|^Microsoft URL Control|^Minefield|^Mister PiX|^Moblie Safari|^Mojeek|^Mojolicious|^MolokaiBot|^Morfeus Fucking Scanner|^Mozlila|^Mr\.4x3|^Msrabot|^Musobot|^NICErsPRO|^NPbot|^Name Intelligence|^NAMEPROTECT|^Navroad|^NearSite|^Needle|^Nessus|^NetAnts|^NetLyzer|^NetMechanic|^NetSpider|^NetZIP|^Net Vampire|^Netcraft|^Nettrack|^Netvibes|^NextGenSearchBot|^Nibbler|^niki-bot|^Nikto|^NimbleCrawler|^Nimbostratus|^Nimbostratus-Bot|^Ninja|^Nmap|^nmap|^Nuclei|^Nutch|^OAI-SearchBot|^Octopus|^Odin|^Offline\.Explorer|^Offline\.Navigator|^OnCrawl|^OpenLinkProfiler|^OpenVAS|^Openfind|^Openvas|^OrangeBot|^OrangeSpider|^OutclicksBot|^OutfoxBot)" 1;
